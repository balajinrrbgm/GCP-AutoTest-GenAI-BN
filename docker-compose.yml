version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: healthcare_testgen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - healthcare-testgen

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - healthcare-testgen

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthcare_testgen
      - REDIS_URL=redis://redis:6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-credentials.json
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./credentials:/app/credentials
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - healthcare-testgen
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
      - REACT_APP_FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - REACT_APP_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - REACT_APP_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - healthcare-testgen
    restart: unless-stopped

  # Document Processing Service
  document-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.document-processor
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-credentials.json
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/document_processor:/app
      - ./credentials:/app/credentials
      - ./uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - healthcare-testgen
    restart: unless-stopped

  # AI Processing Service
  ai-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-processor
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-credentials.json
      - VERTEX_AI_LOCATION=us-central1
      - GEMINI_MODEL=gemini-1.5-pro
    volumes:
      - ./backend/ai_engine:/app
      - ./credentials:/app/credentials
    depends_on:
      - redis
    networks:
      - healthcare-testgen
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - healthcare-testgen
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  healthcare-testgen:
    driver: bridge